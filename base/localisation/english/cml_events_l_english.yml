l_english:
 sov_cml.1.t:0 "Letter to the Central Committee"
 sov_cml.1.d:0 "Letters from factories demand that the party leadership be corrected from below. The committee must decide how loudly to answer."
 sov_cml.1.a:0 "Answer publicly"
 sov_cml.1.b:0 "Discuss internally"
 sov_cml.2.t:0 "The General Secretary Under Pressure"
 sov_cml.2.d:0 "The base blames Zyuganov for the entanglement of the apparatus. Keep him, or let a new leader from the factories take over."
 sov_cml.2.a:0 "Zyuganov stays"
 sov_cml.2.b:0 "He resigns"
 sov_cml.3.t:0 "The Regional Secretary's Case"
 sov_cml.3.d:0 "A regional secretary is accused of shielding factory managers. Try him in public, or remove him quietly."
 sov_cml.3.a:0 "Public trial"
 sov_cml.3.b:0 "Quiet removal"
 sov_cml.4.t:0 "Capital Flight"
 sov_cml.4.d:0 "Entrepreneurs move their assets abroad. Close the capital account, or let the money go."
 sov_cml.4.a:0 "Capital controls"
 sov_cml.4.b:0 "Let it go"
 sov_cml.5.t:0 "The Services Strike Back"
 sov_cml.5.d:0 "Leaks and coup rumours reach the press. Hold out, or settle with the services."
 sov_cml.5.a:0 "Hold out"
 sov_cml.5.b:0 "Settle"
 sov_cml.6.t:0 "The Party Conference"
 sov_cml.6.d:0 "The conference takes stock: party base [?SOV_cml_party_base|0], escalation [?SOV_cml_oscillation|0], wrongful verdicts [?SOV_cml_wrongful_verdicts|0]."
 sov_cml.6.a:0 "Understood"
 sov_cml.10.t:0 "Factions in the Committees"
 sov_cml.10.d:0 "Camps form in the factory committees. Rein them in, or let the movement run."
 sov_cml.10.a:0 "Dampen"
 sov_cml.10.b:0 "Let it run"
 sov_cml.11.t:0 "A Face for the Movement"
 sov_cml.11.d:0 "The factories call for a face to embody the movement. Reject it, or accept."
 sov_cml.11.a:0 "Reject"
 sov_cml.11.b:0 "Accept"
 sov_cml.12.t:0 "Standstill in the Plants"
 sov_cml.12.d:0 "Committees audit each other and shifts stop. The campaign now costs output."
 sov_cml.12.a:0 "It is what it is"
 sov_cml.13.t:0 "The Movement Eats Its Base"
 sov_cml.13.d:0 "Escalation has peaked. The campaign collapses and the party is left with half its base."
 sov_cml.13.a:0 "The end of the campaign"
 sov_cml.20.t:0 "The Correction"
 sov_cml.20.d:0 "The amplified feedback has reached its limit. Catch the campaign in good order, or break it."
 sov_cml.20.a:0 "Catch it"
 sov_cml.20.b:0 "Break it"
