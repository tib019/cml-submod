l_english:
 SOV_cml_democratic_centralism:0 "Democratic Centralism"
 SOV_cml_democratic_centralism_desc:0 "Feedback is channelled: decisions are prepared from below and carried together."
 SOV_cml_exhausted_movement:0 "Exhausted Movement"
 SOV_cml_exhausted_movement_desc:0 "The campaign has consumed its own base. Distrust and fatigue paralyse party and state."
 SOV_cml_factory_standstill:0 "Factory Standstill"
 SOV_cml_factory_standstill_desc:0 "Committees quarrel, shifts idle. Production runs at half speed."
 SOV_cml_leader_cult:0 "Leader Cult"
 SOV_cml_leader_cult_desc:0 "The movement has found a face. Stability rises, criticism from below fades."
 SOV_cml_feedback_modifier:0 "The Great Feedback"
 SOV_cml_feedback_modifier_desc:0 "The base acts back on the party leadership. Until the loop is closed, the campaign costs calm and room to act."
 cml_feedback_entry_category:0 "The Party and Its Base"
 cml_feedback_entry_category_desc:0 "The party has lost its feedback. Restore it by carrying the base's signal to the centre."
 SOV_cml_signal_to_the_centre:0 "The Signal to the Centre"
 SOV_cml_signal_to_the_centre_desc:0 "The base sends its signal to the centre: the party is to be corrected from below. The previous Russian focus tree is replaced by the CML tree; a focus in progress is lost."
