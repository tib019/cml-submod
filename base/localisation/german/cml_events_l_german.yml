l_german:
 sov_cml.1.t:0 "Brief an das Zentralkomitee"
 sov_cml.1.d:0 "Aus Dutzenden Betrieben sind Briefe eingegangen. Die Basis fordert, dass die Parteiführung sich von unten korrigieren lässt und die Verwachsenen im Apparat zur Rede stellt. Darja Wolnowa, Gewerkschafterin aus einem Autowerk an der Wolga, hat die Unterschriften gesammelt und bittet um eine Antwort. Das Zentralkomitee muss entscheiden, wie laut es dieses Signal beantwortet. Ein offener Brief macht die Bewegung stark, aber auch schwer zu steuern."
 sov_cml.1.a:0 "Den Brief öffentlich beantworten"
 sov_cml.1.b:0 "Intern beraten und die Wogen glätten"
 sov_cml.2.t:0 "Der Generalsekretär unter Druck"
 sov_cml.2.d:0 "Die Basis macht Zyuganov mitverantwortlich für die Verwachsung des Apparats mit Oligarchen und Diensten. Sein Rückhalt im Zentralkomitee bröckelt. Hält die Partei an ihm fest, bleibt die Lage ruhig, die Bewegung aber verliert Schwung. Ein Rücktritt öffnet den Weg für eine neue Führung aus den Betrieben, kostet jedoch Ruhe im Land."
 sov_cml.2.a:0 "Zyuganov bleibt im Amt"
 sov_cml.2.b:0 "Der Generalsekretär tritt zurück"
 sov_cml.3.t:0 "Der Fall des Gebietssekretärs"
 sov_cml.3.d:0 "Ein Gebietssekretär soll Fabrikleitungen gedeckt und Gelder umgeleitet haben. Die Betriebsgruppen verlangen ein öffentliches Verfahren. Die Partei kann den Fall offen verhandeln und damit Vertrauen gewinnen, oder den Mann still abberufen, um keinen Präzedenzfall zu schaffen. Jedes offene Verfahren ermuntert weitere Anzeigen, nicht alle davon werden gerecht sein."
 sov_cml.3.a:0 "Öffentliches Verfahren"
 sov_cml.3.b:0 "Stille Abberufung"
 sov_cml.4.t:0 "Kapitalflucht"
 sov_cml.4.d:0 "Nach dem Bruch mit den Oligarchen schaffen Unternehmer ihr Vermögen außer Landes. Die Zentralbank meldet Abflüsse in Milliardenhöhe. Strenge Kapitalverkehrskontrollen halten das Geld im Land, verprellen aber die westlichen Hauptstädte. Wer das Kapital ziehen lässt, zahlt mit einer leeren Kasse, hält jedoch die Märkte ruhig."
 sov_cml.4.a:0 "Den Kapitalverkehr schließen"
 sov_cml.4.b:0 "Das Kapital ziehen lassen"
 sov_cml.5.t:0 "Gegenschlag der Dienste"
 sov_cml.5.d:0 "Die gelösten Seilschaften lassen die Dienste nicht ruhen. Durchgestochene Akten und Gerüchte über Putschpläne erreichen die Presse. Die Führung kann den Konflikt durchstehen und riskiert damit Unruhe im Apparat. Sie kann sich auch mit den Diensten einigen und ihnen Zugeständnisse machen, die der Basis schwer zu erklären sind."
 sov_cml.5.a:0 "Den Konflikt durchstehen"
 sov_cml.5.b:0 "Sich mit den Diensten einigen"
 sov_cml.6.t:0 "Die Parteikonferenz"
 sov_cml.6.d:0 "Die Konferenz zieht Bilanz. Die Parteibasis steht derzeit bei [?SOV_cml_party_base|0] von 100. Das Aufschaukeln der Kampagne liegt bei [?SOV_cml_oscillation|0] von 100. Bisher sind [?SOV_cml_wrongful_verdicts|0] Fehlurteile aktenkundig. Die Delegierten wissen, dass jede Zahl eine Rückkopplung ist: Was die Basis stärkt, kann sich auch gegen sie wenden."
 sov_cml.6.a:0 "Verstanden"
 sov_cml.10.t:0 "Fraktionen in den Komitees"
 sov_cml.10.d:0 "In den Betriebskomitees bilden sich Lager, die einander der Abweichung bezichtigen. Aus Kontrolle von unten wird Misstrauen zwischen den Kollegen. Die Führung kann die Komitees zur Ordnung rufen, was Autorität kostet, oder die Bewegung laufen lassen, die dadurch weiter Fahrt aufnimmt."
 sov_cml.10.a:0 "Die Komitees dämpfen"
 sov_cml.10.b:0 "Laufen lassen"
 sov_cml.11.t:0 "Ein Gesicht für die Bewegung"
 sov_cml.11.d:0 "Aus den Betrieben kommt der Ruf nach einer Person, die die Bewegung verkörpert. Plakate zeigen bereits ein Gesicht. Die Führung kann das zurückweisen und riskiert, Anhänger zu verprellen. Nimmt sie es an, gewinnt die Bewegung Ruhe nach innen, ersetzt aber Kritik von unten durch Verehrung von oben."
 sov_cml.11.a:0 "Zurückweisen"
 sov_cml.11.b:0 "Annehmen"
 sov_cml.12.t:0 "Stillstand in den Werken"
 sov_cml.12.d:0 "Die Komitees prüfen einander, die Schichten ruhen. Wo jeder jeden kontrolliert, läuft die Produktion nur noch halb. Das Werk an der Wolga steht, weil sich die Belegschaft über den Schichtleiter nicht einigen kann. Die Kampagne zahlt jetzt sichtbar mit Produktion."
 sov_cml.12.a:0 "Die Lage ist, wie sie ist"
 sov_cml.13.t:0 "Die Bewegung frisst ihre Basis"
 sov_cml.13.d:0 "Das Aufschaukeln hat den Höchstwert erreicht. Jeder verdächtigt jeden, die Versammlungssäle leeren sich. Was als Korrektur von unten begann, hat die eigenen Träger aufgezehrt. Die Kampagne bricht zusammen, und die Partei bleibt mit einer halbierten Basis zurück."
 sov_cml.13.a:0 "Das Ende der Kampagne"
 sov_cml.20.t:0 "Die Korrektur"
 sov_cml.20.d:0 "Die verstärkte Rückkopplung hat die Bewegung an ihre Grenze geführt. Die Partei muss jetzt eingreifen. Sie kann die Kampagne geordnet auffangen und dafür einen Teil der Basis opfern. Oder sie bricht sie, und die Bewegung endet im Zusammenbruch."
 sov_cml.20.a:0 "Die Kampagne auffangen"
 sov_cml.20.b:0 "Die Kampagne brechen"
