l_german:
 SOV_cml_democratic_centralism:0 "Demokratischer Zentralismus"
 SOV_cml_democratic_centralism_desc:0 "Die Rückkopplung ist in feste Bahnen gelenkt: Beschlüsse werden von unten vorbereitet, von oben gebündelt und gemeinsam getragen. Die Partei steuert wieder mit Blick auf ihre Basis."
 SOV_cml_exhausted_movement:0 "Ausgebrannte Bewegung"
 SOV_cml_exhausted_movement_desc:0 "Die Kampagne hat ihre eigene Basis aufgezehrt. Misstrauen, Erschöpfung und leere Versammlungssäle lähmen Partei und Verwaltung."
 SOV_cml_factory_standstill:0 "Stillstand in den Werken"
 SOV_cml_factory_standstill_desc:0 "Die Komitees streiten, die Schichten ruhen. Wo jeder jeden kontrolliert, läuft die Produktion nur noch halb."
 SOV_cml_leader_cult:0 "Kult um die Führung"
 SOV_cml_leader_cult_desc:0 "Die Bewegung hat sich ein Gesicht gegeben. Das stabilisiert kurzfristig, ersetzt aber die Kritik von unten durch Verehrung von oben."
 SOV_cml_feedback_modifier:0 "Die Große Rückkopplung"
 SOV_cml_feedback_modifier_desc:0 "Die Basis wirkt auf die eigene Parteiführung zurück. Solange der Regelkreis nicht geschlossen ist, kostet die Bewegung Ruhe und Handlungsspielraum, stärkt aber die kommunistische Strömung."
 cml_feedback_entry_category:0 "Die Partei und ihre Basis"
 cml_feedback_entry_category_desc:0 "Die Partei hat ihre Rückkopplung verloren. Wer sie wiederherstellen will, muss das Signal der Basis an die Zentrale tragen."
 SOV_cml_signal_to_the_centre:0 "Das Signal an die Zentrale"
 SOV_cml_signal_to_the_centre_desc:0 "Die Basis schickt ihr Signal an die Zentrale: Die Partei soll sich von unten korrigieren lassen. Wer diesen Weg einschlägt, startet die Große Rückkopplung. Wird in den nächsten Wochen eine der drei Gabelungen der Parteiführung gewählt, verfällt der Antrag ohne Wirkung. Der bisherige Russland-Fokusbaum wird dabei durch den CML-Baum ersetzt; ein laufender Fokus geht verloren."
