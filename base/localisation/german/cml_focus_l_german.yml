l_german:
 SOV_cml_open_channels:0 "Offene Kanäle in den Betrieben"
 SOV_cml_open_channels_desc:0 "Die Partei öffnet Meldewege von der Werkbank bis ins Zentralkomitee. Was die Arbeiter sehen, soll die Führung hören, und zwar ungefiltert. Das Signal der Basis erreicht erstmals wieder die Zentrale, doch wo es laut wird, beginnt es auch sich zu verstärken."
 SOV_cml_cadres_before_the_base:0 "Die Kader vor die Basis"
 SOV_cml_cadres_before_the_base_desc:0 "Bevor die Basis urteilen darf, müssen die Kader selbst Rechenschaft ablegen. Gebietssekretäre werden vorgeladen, Seilschaften aufgedeckt, Posten neu besetzt. Die Säuberung beginnt oben, doch wer sie einmal angestoßen hat, kontrolliert nicht mehr, wie weit sie läuft."
 SOV_cml_cut_oligarch_ties:0 "Die Oligarchen-Verbindungen kappen"
 SOV_cml_cut_oligarch_ties_desc:0 "Die Rohstoffrente hat den Apparat mit den Oligarchen verwachsen lassen. Die Partei kappt diese Verbindungen und holt die Gewerkschaften an ihre Stelle. Das Kapital wird nervös, und nicht jeder Rubel bleibt im Land."
 SOV_cml_untie_siloviki:0 "Die Silowiki-Seilschaften lösen"
 SOV_cml_untie_siloviki_desc:0 "Die Dienste haben ihre eigenen Loyalitäten und ihre eigenen Akten. Die Partei löst die Seilschaften und stellt die Sicherheitsorgane unter ihre Kontrolle. Das stärkt die Führung, kann aber einen Gegenschlag auslösen."
 SOV_cml_new_cadres:0 "Neue Kader aus den Betrieben"
 SOV_cml_new_cadres_desc:0 "Die frei gewordenen Posten füllt die Partei mit Menschen aus den Betrieben. Sie kennen die Werkbank, nicht den Apparat. Die Kaderschulen bilden sie aus, und die Rückkopplung beruhigt sich, weil die Basis nun selbst in der Zentrale sitzt."
 SOV_cml_centre_replies:0 "Die Zentrale antwortet"
 SOV_cml_centre_replies_desc:0 "Der Regelkreis schließt sich nur, wenn die Zentrale auf das Signal der Basis antwortet. Eine Parteikonferenz zieht Bilanz: Was ist erreicht, was kippt, was muss gedämpft werden? Die Antwort der Zentrale entscheidet über den Ausgang der Kampagne."
 SOV_cml_close_the_loop:0 "Den Regelkreis schließen"
 SOV_cml_close_the_loop_desc:0 "Die Partei schließt den Regelkreis in festen Räten und Verfahren. Die Kampagne endet, bevor sie die eigene Basis frisst, und aus der Erneuerung wird Demokratischer Zentralismus. Dieser Weg ist nur offen, solange das Aufschaukeln noch beherrschbar ist."
 SOV_cml_amplify_the_feedback:0 "Die Rückkopplung verstärken"
 SOV_cml_amplify_the_feedback_desc:0 "Die Führung gibt die Dämpfung auf und lässt die Bewegung laufen. Die Basis wächst schnell, doch die Rückkopplung schaukelt sich ungebremst auf. Irgendwann kommt die Korrektur, und sie kostet."
