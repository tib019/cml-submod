name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Prüfung
        run: python tools/check.py
      - name: Rechnung
        run: python tools/sim.py
      - name: Build
        run: python tools/build.py
